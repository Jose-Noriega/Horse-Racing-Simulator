<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horse Racing Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐎%3C/text%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* The stage fills the window (or the screen in fullscreen) and letterboxes the 16:9 canvas. */
    #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    #game {
      /* 1280x720 logical. Fit inside the stage, keep 16:9. */
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: block;
      touch-action: manipulation;
    }
    #loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      background: #000;
      color: #fff;
      font: bold 24px system-ui, sans-serif;
    }
    #loading[hidden] { display: none; }
    #loading progress { width: min(320px, 70vw); height: 12px; accent-color: #e0ad3d; }
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background: #000b;
    }
    #start-overlay[hidden] { display: none; }
    #start-button {
      padding: 16px 30px;
      border: 3px solid #e0ad3d;
      border-radius: 12px;
      background: #241a0b;
      color: #fff;
      font: bold 24px system-ui, sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage"><canvas id="game" width="1280" height="720"></canvas></div>
  <div id="loading" role="status" aria-live="polite">
    <div id="loading-label">Loading...</div>
    <progress id="loading-progress" max="1" value="0"></progress>
  </div>
  <div id="start-overlay" hidden>
    <button id="start-button" type="button">Click to enter</button>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
