<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horse Racing Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐎%3C/text%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* The stage fills the window (or the screen in fullscreen) and letterboxes the 16:9 canvas. */
    #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
    #game {
      /* 1280x720 logical. Fit inside the stage, keep 16:9. */
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      display: block;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="stage"><canvas id="game" width="1280" height="720"></canvas></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
